<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>404 — Page Not Found | Zudo POS</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#f7f5f0',
              'on-surface': '#1a1a1a',
              'on-surface-variant': '#6b6b6b',
              'surface-container': '#f0ede8',
              'surface-container-low': '#fcfaf5',
              'surface-container-lowest': '#ffffff',
              'surface-tint': '#6f46b9',
              'on-primary': '#ffffff',
              secondary: '#6f46b9',
              'secondary-container': '#f0eaff',
              outline: '#d0ccc6',
              'outline-variant': '#e0dcd6',
            },
            fontFamily: {
              headline: ['Manrope', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    </style>
  </head>
  <body class="bg-background font-body text-on-surface antialiased min-h-screen flex items-center justify-center">
    <div class="text-center px-6 max-w-lg">
      <span class="material-symbols-outlined text-[120px] text-surface-tint/20 mb-6">link_off</span>
      <h1 class="text-8xl font-headline font-black text-surface-tint mb-4">404</h1>
      <p class="text-xl font-headline font-bold text-on-surface mb-2">Page not found</p>
      <p class="text-on-surface-variant mb-8">The page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="inline-flex items-center gap-2 h-12 px-6 bg-surface-tint text-on-primary rounded-xl font-headline font-bold shadow-lg hover:-translate-y-0.5 hover:shadow-xl transition-all">
        <span class="material-symbols-outlined text-lg">arrow_back</span>
        Back to Home
      </a>
    </div>
  </body>
</html>
