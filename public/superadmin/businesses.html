<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Businesses - Zudo</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      body { font-family: 'Inter', sans-serif; background-color: #f8f9ff; }
      h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: { background: '#f8f9ff', surface: '#f8f9ff', 'surface-bright': '#f8f9ff', 'surface-dim': '#ccdbf4', 'surface-container': '#e6eeff', 'surface-container-low': '#eff4ff', 'surface-container-high': '#dde9ff', 'surface-container-lowest': '#ffffff', 'surface-variant': '#d5e3fd', 'on-surface': '#0d1c2f', 'on-surface-variant': '#45474c', 'on-background': '#0d1c2f', outline: '#76777c', 'outline-variant': '#c6c6cc', primary: '#000b01', 'primary-container': '#002704', 'on-primary': '#ffffff', 'on-primary-container': '#499849', secondary: '#6f46b9', 'secondary-container': '#b188ff', 'on-secondary': '#ffffff', 'on-secondary-container': '#44118d', error: '#ba1a1a', 'error-container': '#ffdad6', 'on-error': '#ffffff', 'on-error-container': '#93000a', 'inverse-surface': '#233144', 'inverse-on-surface': '#ebf1ff', 'surface-tint': '#1b6d24', },
            borderRadius: { DEFAULT: '0.125rem', lg: '0.25rem', xl: '0.5rem', full: '0.75rem' },
            fontFamily: { headline: ['Manrope'], body: ['Inter'], label: ['Inter'] },
          },
        },
      }
    </script>
    <script src="/js/api.js"></script>
    <script src="/api/superadmin.js"></script>
    <script src="/js/data-bind.js"></script>
    <script src="/js/page-init.js"></script>
  </head>
  <body class="bg-surface text-on-surface">
    <div data-component="superadmin-sidebar"></div>
    <header class="flex justify-between items-center px-8 h-16 ml-72 w-[calc(100%-18rem)] sticky top-0 z-40 bg-[#f8f9ff]/80 backdrop-blur-md border-b border-outline-variant/20">
      <div class="flex items-center gap-4">
        <h2 class="font-headline font-bold text-lg">Businesses</h2>
      </div>
      <button class="bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-amber-600 transition-colors flex items-center gap-2">
        <span class="material-symbols-outlined text-sm">add</span>
        Add Business
      </button>
    </header>
    <main class="ml-72 p-8">
      <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/10">
        <div class="p-4 border-b border-outline-variant/10 flex items-center gap-4">
          <div class="relative flex-1 max-w-md">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
            <input class="w-full pl-10 pr-4 py-2 bg-surface-container-low rounded-lg text-sm outline-none border border-outline-variant/20 focus:border-amber-500" placeholder="Search businesses..." type="text" />
          </div>
          <select class="bg-surface-container-low rounded-lg px-3 py-2 text-sm border border-outline-variant/20 outline-none">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="pending">Pending</option>
            <option value="suspended">Suspended</option>
          </select>
        </div>
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-on-surface-variant text-xs uppercase tracking-widest font-bold bg-surface-container-low/50">
              <th class="px-6 py-4">Business</th>
              <th class="px-6 py-4">Plan</th>
              <th class="px-6 py-4">Branches</th>
              <th class="px-6 py-4">Users</th>
              <th class="px-6 py-4">Status</th>
              <th class="px-6 py-4">Joined</th>
              <th class="px-6 py-4"></th>
            </tr>
          </thead>
          <tbody id="businesses-list">
            <template data-list="businesses" data-empty="No businesses found">
              <tr class="border-b border-outline-variant/10 hover:bg-surface-container-low/50">
                <td class="px-6 py-4">
                  <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-primary-container flex items-center justify-center">
                      <span class="material-symbols-outlined text-on-primary-container text-sm">storefront</span>
                    </div>
                    <div>
                      <p class="font-semibold" data-text="name">—</p>
                      <p class="text-xs text-on-surface-variant" data-text="email">—</p>
                    </div>
                  </div>
                </td>
                <td class="px-6 py-4"><span class="font-semibold" data-text="plan">—</span></td>
                <td class="px-6 py-4" data-text="branches_count" data-format="number">—</td>
                <td class="px-6 py-4" data-text="users_count" data-format="number">—</td>
                <td class="px-6 py-4">
                  <span class="text-xs px-2 py-0.5 rounded-full font-semibold" data-class="status" data-text="status">—</span>
                </td>
                <td class="px-6 py-4 text-on-surface-variant" data-text="created_at" data-format="date">—</td>
                <td class="px-6 py-4">
                  <button class="text-on-surface-variant hover:text-amber-500">
                    <span class="material-symbols-outlined">more_vert</span>
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <div class="p-4 border-t border-outline-variant/10 flex items-center justify-between">
          <span class="text-sm text-on-surface-variant" data-text="pagination.info">—</span>
          <div class="flex gap-2" data-show="pagination.total_pages">
            <button class="px-3 py-1.5 bg-surface-container-low rounded-lg text-sm font-medium hover:bg-surface-container-high transition-colors">Previous</button>
            <button class="px-3 py-1.5 bg-amber-500 text-white rounded-lg text-sm font-medium">1</button>
            <button class="px-3 py-1.5 bg-surface-container-low rounded-lg text-sm font-medium hover:bg-surface-container-high transition-colors">Next</button>
          </div>
        </div>
      </div>
    </main>
    <script src="/js/components.js"></script>
    <script>
      window.__pageInit = { fetch: () => SuperAdminAPI.getBusinesses({ page: 1, limit: 20 }) }
    </script>
  </body>
</html>
