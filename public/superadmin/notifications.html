<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Notifications - Zudo</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      body { font-family: 'Inter', sans-serif; background-color: #f8f9ff; }
      h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: { background: '#f8f9ff', surface: '#f8f9ff', 'surface-bright': '#f8f9ff', 'surface-dim': '#ccdbf4', 'surface-container': '#e6eeff', 'surface-container-low': '#eff4ff', 'surface-container-high': '#dde9ff', 'surface-container-lowest': '#ffffff', 'surface-variant': '#d5e3fd', 'on-surface': '#0d1c2f', 'on-surface-variant': '#45474c', 'on-background': '#0d1c2f', outline: '#76777c', 'outline-variant': '#c6c6cc', primary: '#000b01', 'primary-container': '#002704', 'on-primary': '#ffffff', 'on-primary-container': '#499849', secondary: '#6f46b9', 'secondary-container': '#b188ff', 'on-secondary': '#ffffff', 'on-secondary-container': '#44118d', error: '#ba1a1a', 'error-container': '#ffdad6', 'on-error': '#ffffff', 'on-error-container': '#93000a', 'inverse-surface': '#233144', 'inverse-on-surface': '#ebf1ff', 'surface-tint': '#1b6d24', },
            borderRadius: { DEFAULT: '0.125rem', lg: '0.25rem', xl: '0.5rem', full: '0.75rem' },
            fontFamily: { headline: ['Manrope'], body: ['Inter'], label: ['Inter'] },
          },
        },
      }
    </script>
    <script src="/js/api.js"></script>
    <script src="/api/superadmin.js"></script>
    <script src="/js/data-bind.js"></script>
    <script src="/js/page-init.js"></script>
  </head>
  <body class="bg-surface text-on-surface">
    <div data-component="superadmin-sidebar"></div>
    <header class="flex justify-between items-center px-8 h-16 ml-72 w-[calc(100%-18rem)] sticky top-0 z-40 bg-[#f8f9ff]/80 backdrop-blur-md border-b border-outline-variant/20">
      <div class="flex items-center gap-4">
        <h2 class="font-headline font-bold text-lg">Notifications</h2>
      </div>
    </header>
    <main class="ml-72 p-8">
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
        <div class="lg:col-span-2">
          <div class="bg-surface-container-lowest rounded-xl shadow-sm p-6 border border-outline-variant/10">
            <h3 class="font-headline font-bold text-lg mb-4">Send Broadcast</h3>
            <div class="space-y-4">
              <div>
                <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant block mb-1">Audience</label>
                <select class="w-full bg-surface-container-low rounded-lg px-3 py-2.5 text-sm border border-outline-variant/20 outline-none focus:border-amber-500" id="broadcast-audience">
                  <option value="all">All businesses</option>
                  <option value="starter">Starter plan only</option>
                  <option value="professional">Professional plan only</option>
                  <option value="enterprise">Enterprise plan only</option>
                </select>
              </div>
              <div>
                <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant block mb-1">Title</label>
                <input class="w-full bg-surface-container-low rounded-lg px-3 py-2.5 text-sm border border-outline-variant/20 outline-none focus:border-amber-500" type="text" placeholder="e.g. System Maintenance" id="broadcast-title" />
              </div>
              <div>
                <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant block mb-1">Message</label>
                <textarea class="w-full bg-surface-container-low rounded-lg px-3 py-2.5 text-sm border border-outline-variant/20 outline-none focus:border-amber-500 h-32 resize-none" placeholder="Type your broadcast message..." id="broadcast-message"></textarea>
              </div>
              <button class="w-full bg-amber-500 text-white py-3 rounded-lg font-bold hover:bg-amber-600 transition-colors flex items-center justify-center gap-2" id="broadcast-send">
                <span class="material-symbols-outlined text-sm">send</span>
                Send Broadcast
              </button>
            </div>
          </div>
        </div>
        <div class="lg:col-span-3">
          <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/10">
            <div class="p-4 border-b border-outline-variant/10">
              <h3 class="font-headline font-bold">Broadcast History</h3>
            </div>
            <div class="divide-y divide-outline-variant/10" id="broadcast-history">
              <template data-list="history" data-empty="No broadcasts sent yet">
                <div class="p-4 hover:bg-surface-container-low/50">
                  <div class="flex items-start justify-between mb-2">
                    <h4 class="font-semibold text-sm" data-text="title">—</h4>
                    <span class="text-xs text-on-surface-variant" data-text="sent_at" data-format="datetime">—</span>
                  </div>
                  <p class="text-sm text-on-surface-variant" data-text="message">—</p>
                  <div class="flex items-center gap-2 mt-2">
                    <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-semibold">Delivered</span>
                    <span class="text-xs text-on-surface-variant" data-text="recipient_count" data-format="number">—</span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="/js/components.js"></script>
    <script>
      window.__pageInit = { fetch: SuperAdminAPI.getBroadcastHistory }

      document.addEventListener('components-loaded', () => {
        document.getElementById('broadcast-send')?.addEventListener('click', async () => {
          const title = document.getElementById('broadcast-title')?.value
          const message = document.getElementById('broadcast-message')?.value
          const audience = document.getElementById('broadcast-audience')?.value
          if (!title || !message) return alert('Please fill in title and message')
          try {
            await SuperAdminAPI.sendBroadcast({ title, message, audience })
            alert('Broadcast sent successfully!')
            window.location.reload()
          } catch (err) {
            alert('Failed to send broadcast: ' + err.message)
          }
        })
      })
    </script>
  </body>
</html>
