<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Subscriptions & Billing - Zudo</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      body { font-family: 'Inter', sans-serif; background-color: #f8f9ff; }
      h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: { background: '#f8f9ff', surface: '#f8f9ff', 'surface-bright': '#f8f9ff', 'surface-dim': '#ccdbf4', 'surface-container': '#e6eeff', 'surface-container-low': '#eff4ff', 'surface-container-high': '#dde9ff', 'surface-container-lowest': '#ffffff', 'surface-variant': '#d5e3fd', 'on-surface': '#0d1c2f', 'on-surface-variant': '#45474c', 'on-background': '#0d1c2f', outline: '#76777c', 'outline-variant': '#c6c6cc', primary: '#000b01', 'primary-container': '#002704', 'on-primary': '#ffffff', 'on-primary-container': '#499849', secondary: '#6f46b9', 'secondary-container': '#b188ff', 'on-secondary': '#ffffff', 'on-secondary-container': '#44118d', error: '#ba1a1a', 'error-container': '#ffdad6', 'on-error': '#ffffff', 'on-error-container': '#93000a', 'inverse-surface': '#233144', 'inverse-on-surface': '#ebf1ff', 'surface-tint': '#1b6d24', },
            borderRadius: { DEFAULT: '0.125rem', lg: '0.25rem', xl: '0.5rem', full: '0.75rem' },
            fontFamily: { headline: ['Manrope'], body: ['Inter'], label: ['Inter'] },
          },
        },
      }
    </script>
    <script src="/js/api.js"></script>
    <script src="/api/superadmin.js"></script>
    <script src="/js/data-bind.js"></script>
    <script src="/js/page-init.js"></script>
  </head>
  <body class="bg-surface text-on-surface">
    <div data-component="superadmin-sidebar"></div>
    <header class="flex justify-between items-center px-8 h-16 ml-72 w-[calc(100%-18rem)] sticky top-0 z-40 bg-[#f8f9ff]/80 backdrop-blur-md border-b border-outline-variant/20">
      <div class="flex items-center gap-4">
        <h2 class="font-headline font-bold text-lg">Subscriptions & Billing</h2>
      </div>
      <button class="bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-amber-600 transition-colors flex items-center gap-2">
        <span class="material-symbols-outlined text-sm">add</span>
        New Plan
      </button>
    </header>
    <main class="ml-72 p-8">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8" id="plans-container">
        <template data-list="plans">
          <div class="bg-surface-container-lowest rounded-xl shadow-sm p-6 border border-outline-variant/10 text-center">
            <div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mx-auto mb-4">
              <span class="material-symbols-outlined text-on-surface-variant" data-attr="data-icon:icon">rocket_launch</span>
            </div>
            <h3 class="font-headline font-bold text-lg" data-text="name">—</h3>
            <p class="text-3xl font-black font-headline mt-2">
              <span data-text="price" data-format="currency">—</span><span class="text-sm font-normal text-on-surface-variant">/mo</span>
            </p>
            <p class="text-sm text-on-surface-variant mt-1" data-text="description">—</p>
            <p class="text-xs text-on-surface-variant mt-2" data-text="business_count" data-format="number">—</p>
          </div>
        </template>
      </div>
      <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/10">
        <div class="p-4 border-b border-outline-variant/10">
          <h3 class="font-headline font-bold">Recent Invoices</h3>
        </div>
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-on-surface-variant text-xs uppercase tracking-widest font-bold bg-surface-container-low/50">
              <th class="px-6 py-4">Invoice</th>
              <th class="px-6 py-4">Business</th>
              <th class="px-6 py-4">Plan</th>
              <th class="px-6 py-4">Amount</th>
              <th class="px-6 py-4">Status</th>
              <th class="px-6 py-4">Date</th>
            </tr>
          </thead>
          <tbody id="invoices-list">
            <template data-list="invoices" data-empty="No invoices found">
              <tr class="border-b border-outline-variant/10">
                <td class="px-6 py-4 font-mono text-xs" data-text="invoice_number">—</td>
                <td class="px-6 py-4" data-text="business_name">—</td>
                <td class="px-6 py-4" data-text="plan_name">—</td>
                <td class="px-6 py-4 font-semibold" data-text="amount" data-format="currency">—</td>
                <td class="px-6 py-4"><span class="text-xs px-2 py-0.5 rounded-full font-semibold" data-class="status" data-text="status">—</span></td>
                <td class="px-6 py-4 text-on-surface-variant" data-text="date" data-format="date">—</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </main>
    <script src="/js/components.js"></script>
    <script>
      window.__pageInit = {
        async fetch() {
          const [plans, invoices] = await Promise.all([
            SuperAdminAPI.getPlans(),
            SuperAdminAPI.getInvoices({ limit: 20 }),
          ])
          return { plans, invoices }
        }
      }
    </script>
  </body>
</html>
