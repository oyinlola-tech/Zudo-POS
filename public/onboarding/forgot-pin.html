<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reset PIN — Zudo POS</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              outline: '#76777c',
              'on-secondary-container': '#44118d',
              'tertiary-fixed-dim': '#b6c4ff',
              error: '#ba1a1a',
              'surface-container-lowest': '#ffffff',
              'secondary-container': '#b188ff',
              'on-surface-variant': '#45474c',
              'surface-dim': '#ccdbf4',
              'on-background': '#0d1c2f',
              'surface-tint': '#1b6d24',
              'primary-fixed-dim': '#88d982',
              'on-primary-fixed-variant': '#005312',
              'on-primary-container': '#499849',
              'primary-container': '#002704',
              'on-surface': '#0d1c2f',
              'surface-container-highest': '#d5e3fd',
              'on-tertiary-fixed-variant': '#264191',
              'on-tertiary-fixed': '#00164e',
              'surface-container-low': '#eff4ff',
              'on-error-container': '#93000a',
              'tertiary-container': '#001a59',
              'error-container': '#ffdad6',
              'inverse-on-surface': '#ebf1ff',
              'primary-fixed': '#a3f69c',
              primary: '#000b01',
              'secondary-fixed': '#ebdcff',
              background: '#f8f9ff',
              'on-tertiary': '#ffffff',
              'surface-container-high': '#dde9ff',
              'on-secondary-fixed-variant': '#572ba0',
              'on-secondary': '#ffffff',
              'on-primary-fixed': '#002204',
              secondary: '#6f46b9',
              'secondary-fixed-dim': '#d3bbff',
              'outline-variant': '#c6c6cc',
              'on-error': '#ffffff',
              'on-secondary-fixed': '#260059',
              'inverse-primary': '#88d982',
              'surface-variant': '#d5e3fd',
              tertiary: '#000623',
              'surface-container': '#e6eeff',
              'surface-bright': '#f8f9ff',
              'on-tertiary-container': '#6b83d7',
              surface: '#f8f9ff',
              'inverse-surface': '#233144',
              'tertiary-fixed': '#dce1ff',
              'on-primary': '#ffffff',
            },
            borderRadius: {
              DEFAULT: '0.125rem',
              lg: '0.25rem',
              xl: '0.5rem',
              full: '0.75rem',
            },
            fontFamily: {
              headline: ['Manrope'],
              body: ['Inter'],
              label: ['Inter'],
            },
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-background font-body text-on-surface antialiased min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md mx-auto px-6">
      <div class="text-center mb-10">
        <a href="/" class="text-2xl font-headline font-extrabold tracking-tighter text-surface-tint">ZUDO</a>
        <h1 class="text-2xl font-headline font-bold mt-8 mb-2">Reset PIN</h1>
        <p class="text-sm text-on-surface-variant">Verify your identity and set a new cashier PIN</p>
      </div>

      <form id="pinForm" class="space-y-5">
        <div class="hidden p-4 rounded-xl text-sm" id="messageBox"></div>

        <div>
          <label class="text-sm font-bold font-label mb-2 block" for="email">Email Address</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            placeholder="you@business.com"
            class="w-full h-14 px-4 bg-surface-container-lowest border border-outline-variant/30 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-surface-tint/30 focus:border-surface-tint"
          />
        </div>

        <div id="otpSection" class="hidden space-y-5">
          <div>
            <label class="text-sm font-bold font-label mb-2 block" for="otp">Verification Code</label>
            <input
              id="otp"
              name="otp"
              type="text"
              maxlength="6"
              placeholder="000000"
              class="w-full h-14 px-4 text-center text-2xl tracking-[0.5em] font-headline font-bold bg-surface-container-lowest border border-outline-variant/30 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-surface-tint/30 focus:border-surface-tint"
            />
          </div>

          <div>
            <label class="text-sm font-bold font-label mb-2 block" for="newPin">New PIN</label>
            <input
              id="newPin"
              name="newPin"
              type="password"
              maxlength="4"
              placeholder="0000"
              class="w-full h-14 px-4 text-center text-2xl tracking-[0.5em] font-headline font-bold bg-surface-container-lowest border border-outline-variant/30 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-surface-tint/30 focus:border-surface-tint"
            />
          </div>

          <button
            id="submitBtn"
            type="submit"
            class="w-full h-14 bg-surface-tint text-on-primary rounded-xl font-headline font-bold text-sm hover:opacity-90 transition-opacity flex items-center justify-center gap-2"
          >
            <span id="btnText">Reset PIN</span>
            <span id="btnSpinner" class="hidden material-symbols-outlined animate-spin text-sm" data-icon="progress_activity">progress_activity</span>
          </button>
        </div>

        <button
          id="sendOtpBtn"
          type="button"
          class="w-full h-14 bg-surface-container-high text-on-surface rounded-xl font-headline font-bold text-sm hover:opacity-90 transition-opacity flex items-center justify-center gap-2"
        >
          <span id="sendBtnText">Send Verification Code</span>
          <span id="sendBtnSpinner" class="hidden material-symbols-outlined animate-spin text-sm" data-icon="progress_activity">progress_activity</span>
        </button>
      </form>

      <p class="text-center mt-8">
        <a href="/login" class="text-sm font-bold text-surface-tint hover:underline inline-flex items-center gap-1">
          <span class="material-symbols-outlined text-sm" data-icon="arrow_back">arrow_back</span>
          Back to Login
        </a>
      </p>
    </div>

    <script>
      const form = document.getElementById('pinForm')
      const emailInput = document.getElementById('email')
      const otpSection = document.getElementById('otpSection')
      const sendOtpBtn = document.getElementById('sendOtpBtn')
      const sendBtnText = document.getElementById('sendBtnText')
      const sendBtnSpinner = document.getElementById('sendBtnSpinner')
      const submitBtn = document.getElementById('submitBtn')
      const btnText = document.getElementById('btnText')
      const btnSpinner = document.getElementById('btnSpinner')
      const messageBox = document.getElementById('messageBox')

      sendOtpBtn.addEventListener('click', async () => {
        if (!emailInput.value) {
          messageBox.className = 'p-4 rounded-xl text-sm bg-error-container text-on-error-container'
          messageBox.textContent = 'Please enter your email first'
          messageBox.classList.remove('hidden')
          return
        }

        sendBtnText.textContent = 'Sending...'
        sendBtnSpinner.classList.remove('hidden')
        sendOtpBtn.disabled = true
        messageBox.className = 'hidden p-4 rounded-xl text-sm'

        try {
          const res = await fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailInput.value, type: 'pin_reset' }),
          })
          const data = await res.json()

          if (res.ok) {
            otpSection.classList.remove('hidden')
            sendOtpBtn.classList.add('hidden')
            messageBox.className = 'p-4 rounded-xl text-sm bg-primary-fixed/20 text-primary'
            messageBox.textContent = data.message || 'Verification code sent to your email'
            messageBox.classList.remove('hidden')
          } else {
            messageBox.className = 'p-4 rounded-xl text-sm bg-error-container text-on-error-container'
            messageBox.textContent = data.error || 'Something went wrong'
            messageBox.classList.remove('hidden')
          }
        } catch {
          messageBox.className = 'p-4 rounded-xl text-sm bg-error-container text-on-error-container'
          messageBox.textContent = 'Network error. Please try again.'
          messageBox.classList.remove('hidden')
        } finally {
          sendBtnText.textContent = 'Send Verification Code'
          sendBtnSpinner.classList.add('hidden')
          sendOtpBtn.disabled = false
        }
      })

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        if (!otpSection.classList.contains('hidden')) {
          btnText.textContent = 'Resetting...'
          btnSpinner.classList.remove('hidden')
          submitBtn.disabled = true

          try {
            const res = await fetch('/api/auth/forgot-pin', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: emailInput.value,
                otp: document.getElementById('otp').value,
                newPin: document.getElementById('newPin').value,
              }),
            })
            const data = await res.json()

            if (res.ok) {
              messageBox.className = 'p-4 rounded-xl text-sm bg-primary-fixed/20 text-primary'
              messageBox.textContent = data.message || 'PIN reset successfully! Redirecting...'
              messageBox.classList.remove('hidden')
              setTimeout(() => { window.location.href = '/login' }, 2000)
            } else {
              messageBox.className = 'p-4 rounded-xl text-sm bg-error-container text-on-error-container'
              messageBox.textContent = data.error || data.message || 'Something went wrong'
              messageBox.classList.remove('hidden')
            }
          } catch {
            messageBox.className = 'p-4 rounded-xl text-sm bg-error-container text-on-error-container'
            messageBox.textContent = 'Network error. Please try again.'
            messageBox.classList.remove('hidden')
          } finally {
            btnText.textContent = 'Reset PIN'
            btnSpinner.classList.add('hidden')
            submitBtn.disabled = false
          }
        }
      })
    </script>
  </body>
</html>
