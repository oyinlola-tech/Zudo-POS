<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sales History - Zudo POS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-primary-container': '#499849',
              'on-surface': '#0d1c2f',
              'primary-container': '#002704',
              'surface-container-highest': '#d5e3fd',
              'on-tertiary-fixed-variant': '#264191',
              'on-tertiary-fixed': '#00164e',
              'surface-container-low': '#eff4ff',
              'on-error-container': '#93000a',
              'on-secondary-container': '#44118d',
              outline: '#76777c',
              'tertiary-fixed-dim': '#b6c4ff',
              error: '#ba1a1a',
              'surface-container-lowest': '#ffffff',
              'secondary-container': '#b188ff',
              'on-surface-variant': '#45474c',
              'surface-dim': '#ccdbf4',
              'surface-tint': '#1b6d24',
              'on-background': '#0d1c2f',
              'on-primary-fixed-variant': '#005312',
              'primary-fixed-dim': '#88d982',
              'on-error': '#ffffff',
              'inverse-primary': '#88d982',
              'on-secondary-fixed': '#260059',
              'surface-variant': '#d5e3fd',
              tertiary: '#000623',
              'surface-container': '#e6eeff',
              'surface-bright': '#f8f9ff',
              'on-tertiary-container': '#6b83d7',
              surface: '#f8f9ff',
              'inverse-surface': '#233144',
              'tertiary-fixed': '#dce1ff',
              'on-primary': '#ffffff',
              'error-container': '#ffdad6',
              'tertiary-container': '#001a59',
              'primary-fixed': '#a3f69c',
              primary: '#000b01',
              'inverse-on-surface': '#ebf1ff',
              background: '#f8f9ff',
              'secondary-fixed': '#ebdcff',
              'surface-container-high': '#dde9ff',
              'on-secondary-fixed-variant': '#572ba0',
              'on-secondary': '#ffffff',
              'on-primary-fixed': '#002204',
              'on-tertiary': '#ffffff',
              'secondary-fixed-dim': '#d3bbff',
              'outline-variant': '#c6c6cc',
              secondary: '#6f46b9',
            },
            borderRadius: {
              DEFAULT: '0.125rem',
              lg: '0.25rem',
              xl: '0.5rem',
              full: '0.75rem',
            },
            fontFamily: {
              headline: ['Manrope'],
              body: ['Inter'],
              label: ['Inter'],
            },
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      body {
        font-family: 'Inter', sans-serif;
      }
      h1,
      h2,
      h3,
      .headline {
        font-family: 'Manrope', sans-serif;
      }
      .naira-symbol {
        font-family: 'Manrope', sans-serif;
      }
    </style>
    <script src="/js/api.js"></script>
    <script src="/api/cashier.js"></script>
    <script src="/js/data-bind.js"></script>
    <script src="/js/page-init.js"></script>
  </head>
  <body class="bg-surface text-on-surface min-h-screen">
    <!-- SideNavBar Shell -->
    <div data-component="cashier-sidebar"></div>
    <!-- Main Content Canvas -->
    <main class="ml-64 min-h-screen">
      <!-- TopNavBar Shell -->
      <header
        class="flex justify-between items-center w-full px-8 py-3 h-16 bg-[#f8f9ff] dark:bg-slate-950 sticky top-0 z-30"
      >
        <div class="flex items-center gap-4 flex-1">
          <div class="relative w-full max-w-md">
            <span
              class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg"
              data-icon="search"
              >search</span
            >
            <input
              class="w-full bg-surface-container-low border-none rounded-lg pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-secondary/20 placeholder:text-on-surface-variant/60"
              placeholder="Search transactions by ID or customer..."
              type="text"
            />
          </div>
        </div>
        <div class="flex items-center gap-6 ml-8">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-[#1b6d24]" data-icon="cloud_done">cloud_done</span>
            <span class="text-xs font-medium text-on-surface-variant">System Synced</span>
          </div>
          <button
            class="material-symbols-outlined text-on-surface hover:bg-[#eff4ff] p-2 rounded-full transition-colors"
            data-icon="account_circle"
          >
            account_circle
          </button>
        </div>
      </header>
      <div class="p-8 max-w-7xl mx-auto">
        <!-- Summary Stats: Bento Style -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
          <div
            class="md:col-span-2 bg-surface-container-lowest rounded-xl p-8 flex justify-between items-center relative overflow-hidden group"
          >
            <div class="relative z-10">
              <p class="text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2">Total Sales Today</p>
              <div class="flex items-baseline gap-2">
                <span class="naira-symbol text-2xl font-bold text-surface-tint">₦</span>
                <h2 class="headline text-5xl font-extrabold tracking-tighter" data-text="summary.total_sales" data-format="currency"></h2>
              </div>
              <p class="text-xs text-on-surface-variant mt-4 flex items-center gap-1">
                <span class="material-symbols-outlined text-xs text-surface-tint" data-icon="trending_up"
                  >trending_up</span
                >
                <span class="font-semibold text-surface-tint" data-text="summary.increase"></span> from yesterday's shift
              </p>
            </div>
            <div class="hidden lg:block opacity-10 group-hover:opacity-20 transition-opacity">
              <span class="material-symbols-outlined text-[120px]" data-icon="payments">payments</span>
            </div>
            <div class="absolute -right-12 -bottom-12 w-48 h-48 bg-surface-container-low rounded-full blur-3xl"></div>
          </div>
          <div class="bg-primary text-on-primary rounded-xl p-8 flex flex-col justify-center relative overflow-hidden">
            <p class="text-xs font-label uppercase tracking-widest opacity-70 mb-2">Transactions Count</p>
            <h2 class="headline text-6xl font-extrabold tracking-tighter" data-text="summary.count" data-format="number"></h2>
            <p class="text-xs opacity-70 mt-4" data-text="summary.shift_info">Current Shift: 08:00 AM - Present</p>
            <div class="absolute right-4 top-4">
              <span
                class="material-symbols-outlined text-surface-tint text-4xl"
                data-icon="receipt_long"
                data-weight="fill"
                >receipt_long</span
              >
            </div>
          </div>
        </div>
        <!-- Transactions Table: No-Line Architecture -->
        <div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
          <div class="px-8 py-6 flex justify-between items-center">
            <h3 class="headline text-xl font-bold">Shift History</h3>
            <div class="flex gap-3">
              <button
                class="flex items-center gap-2 px-4 py-2 rounded-lg bg-surface-container-low text-on-surface text-sm font-medium hover:bg-surface-container-high transition-colors"
              >
                <span class="material-symbols-outlined text-sm" data-icon="filter_list">filter_list</span>
                Filter
              </button>
              <button
                class="flex items-center gap-2 px-4 py-2 rounded-lg bg-surface-container-low text-on-surface text-sm font-medium hover:bg-surface-container-high transition-colors"
              >
                <span class="material-symbols-outlined text-sm" data-icon="download">download</span>
                Export
              </button>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-surface-container-low/50">
                  <th class="px-8 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant">
                    Order ID
                  </th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant">Time</th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant">
                    Customer
                  </th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant text-right">
                    Total (₦)
                  </th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant">Method</th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant">Status</th>
                  <th class="px-8 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant text-right">
                    Action
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-transparent">
                <template data-list="transactions">
                  <tr class="group hover:bg-surface-container-low transition-colors even:bg-surface-container-low/30">
                    <td class="px-8 py-5 font-mono text-sm font-semibold" data-text="id"></td>
                    <td class="px-6 py-5 text-sm text-on-surface-variant" data-text="time" data-format="time"></td>
                    <td class="px-6 py-5">
                      <div class="flex items-center gap-2">
                        <div
                          class="w-7 h-7 rounded-full bg-secondary-container flex items-center justify-center text-[10px] font-bold text-on-secondary-container"
                          data-text="customer_initials"
                        >
                        </div>
                        <span class="text-sm font-medium" data-text="customer"></span>
                      </div>
                    </td>
                    <td class="px-6 py-5 text-sm font-bold text-right" data-text="total" data-format="currency"></td>
                    <td class="px-6 py-5">
                      <span
                        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-tertiary/10 text-tertiary text-[10px] font-bold uppercase tracking-wider"
                        data-html="method"
                      >
                      </span>
                    </td>
                    <td class="px-6 py-5">
                      <span
                        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider"
                        data-class="status"
                      >
                        <span class="w-1.5 h-1.5 rounded-full" data-class="status"></span>
                        <span data-text="status"></span>
                      </span>
                    </td>
                    <td class="px-8 py-5 text-right">
                      <button
                        class="text-secondary font-bold text-xs uppercase tracking-widest hover:underline decoration-2 underline-offset-4"
                      >
                        View Receipt
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <!-- Pagination/Footer -->
          <div
            class="px-8 py-6 border-t border-surface-container-low bg-surface-container-low/20 flex justify-between items-center"
          >
            <p class="text-xs text-on-surface-variant font-medium" data-text="pagination">Showing 1 to 10 of 42 transactions</p>
            <div class="flex gap-2">
              <button
                class="w-8 h-8 flex items-center justify-center rounded bg-surface-container-lowest shadow-sm text-on-surface-variant hover:text-secondary disabled:opacity-30"
              >
                <span class="material-symbols-outlined text-sm" data-icon="chevron_left">chevron_left</span>
              </button>
              <button
                class="w-8 h-8 flex items-center justify-center rounded bg-secondary text-on-primary text-xs font-bold"
              >
                1
              </button>
              <button
                class="w-8 h-8 flex items-center justify-center rounded bg-surface-container-lowest shadow-sm text-on-surface-variant hover:text-secondary text-xs font-bold"
              >
                2
              </button>
              <button
                class="w-8 h-8 flex items-center justify-center rounded bg-surface-container-lowest shadow-sm text-on-surface-variant hover:text-secondary text-xs font-bold"
              >
                3
              </button>
              <button
                class="w-8 h-8 flex items-center justify-center rounded bg-surface-container-lowest shadow-sm text-on-surface-variant hover:text-secondary"
              >
                <span class="material-symbols-outlined text-sm" data-icon="chevron_right">chevron_right</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <button
      class="fixed bottom-8 right-8 w-14 h-14 rounded-full bg-primary-container text-primary-fixed shadow-2xl flex items-center justify-center group hover:scale-110 transition-transform md:hidden z-50"
    >
      <span class="material-symbols-outlined text-2xl" data-icon="add">add</span>
    </button>
    <script src="/js/components.js"></script>
    <script>
    window.__pageInit = { fetch: CashierAPI.getTransactions }
    </script>
  </body>
</html>
