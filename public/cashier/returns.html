<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Returns | Zudo POS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-background': '#0d1c2f',
              surface: '#f8f9ff',
              'surface-container-low': '#eff4ff',
              'surface-container-lowest': '#ffffff',
              'surface-container-high': '#dde9ff',
              'surface-tint': '#1b6d24',
              'on-surface': '#0d1c2f',
              'on-surface-variant': '#45474c',
              secondary: '#6f46b9',
              error: '#ba1a1a',
              'error-container': '#ffdad6',
              'on-error': '#ffffff',
            },
            fontFamily: {
              headline: ['Manrope'],
              body: ['Inter'],
              label: ['Inter'],
            },
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      h1,
      h2,
      h3,
      .headline {
        font-family: 'Manrope', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
    </style>
    <script src="/js/api.js"></script>
    <script src="/api/cashier.js"></script>
    <script src="/js/data-bind.js"></script>
    <script src="/js/page-init.js"></script>
  </head>
  <body class="bg-surface text-on-surface min-h-screen">
    <div data-component="cashier-sidebar"></div>

    <main class="ml-64 min-h-screen">
      <header
        class="flex justify-between items-center w-full px-8 py-3 h-16 bg-surface sticky top-0 z-30 border-b border-black/5"
      >
        <h2 class="headline text-lg font-extrabold tracking-tight text-on-surface">Returns</h2>
        <div class="flex items-center gap-4">
          <button
            class="flex items-center gap-2 px-4 py-2 rounded-lg bg-surface-container-low text-on-surface text-sm font-medium hover:bg-surface-container-high transition-colors"
          >
            <span class="material-symbols-outlined text-sm" data-icon="filter_list">filter_list</span>
            Filter
          </button>
          <a
            class="material-symbols-outlined text-on-surface-variant hover:text-secondary transition-colors"
            href="/cashier/profile"
            >account_circle</a
          >
        </div>
      </header>

      <div class="p-8 max-w-5xl mx-auto">
        <div class="bg-surface-container-lowest rounded-2xl border border-black/5 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-surface-container-low/50">
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant">Return ID</th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant">Order Ref</th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant">Customer</th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant">Item</th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant text-right">Amount</th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant">Status</th>
                  <th class="px-6 py-4 text-xs font-label uppercase tracking-widest text-on-surface-variant text-right">Date</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-surface-container-low">
                <template data-list="returns">
                  <tr class="group hover:bg-surface-container-low transition-colors">
                    <td class="px-6 py-4 font-mono text-sm font-semibold" data-text="id"></td>
                    <td class="px-6 py-4 text-sm text-on-surface-variant" data-text="order_ref"></td>
                    <td class="px-6 py-4 text-sm font-medium" data-text="customer"></td>
                    <td class="px-6 py-4 text-sm" data-text="item"></td>
                    <td class="px-6 py-4 text-sm font-bold text-right" data-text="amount" data-format="currency"></td>
                    <td class="px-6 py-4">
                      <span
                        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider"
                        data-class="status"
                      >
                        <span class="w-1.5 h-1.5 rounded-full" data-class="status"></span>
                        <span data-text="status"></span>
                      </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-right text-on-surface-variant" data-text="date" data-format="date"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="px-6 py-4 bg-surface-container-low/20 border-t border-surface-container-low flex justify-between items-center">
            <p class="text-xs text-on-surface-variant font-medium" data-text="pagination">No returns recorded</p>
            <a
              class="h-10 px-5 rounded-xl bg-secondary text-white font-bold text-xs inline-flex items-center justify-center"
              href="/cashier"
            >
              Back to Terminal
            </a>
          </div>
        </div>
      </div>
    </main>
    <script src="/js/components.js"></script>
    <script>
    window.__pageInit = { fetch: CashierAPI.getReturns }
    </script>
  </body>
</html>
