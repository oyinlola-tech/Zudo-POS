<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Zudo POS - Terminal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-primary-container': '#499849',
              'on-surface': '#0d1c2f',
              'primary-container': '#002704',
              'surface-container-highest': '#d5e3fd',
              'on-tertiary-fixed-variant': '#264191',
              'on-tertiary-fixed': '#00164e',
              'surface-container-low': '#eff4ff',
              'on-error-container': '#93000a',
              'on-secondary-container': '#44118d',
              outline: '#76777c',
              'tertiary-fixed-dim': '#b6c4ff',
              error: '#ba1a1a',
              'surface-container-lowest': '#ffffff',
              'secondary-container': '#b188ff',
              'on-surface-variant': '#45474c',
              'surface-dim': '#ccdbf4',
              'surface-tint': '#1b6d24',
              'on-background': '#0d1c2f',
              'on-primary-fixed-variant': '#005312',
              'primary-fixed-dim': '#88d982',
              'on-error': '#ffffff',
              'inverse-primary': '#88d982',
              'on-secondary-fixed': '#260059',
              'surface-variant': '#d5e3fd',
              tertiary: '#000623',
              'surface-container': '#e6eeff',
              'surface-bright': '#f8f9ff',
              'on-tertiary-container': '#6b83d7',
              surface: '#f8f9ff',
              'inverse-surface': '#233144',
              'tertiary-fixed': '#dce1ff',
              'on-primary': '#ffffff',
              'error-container': '#ffdad6',
              'tertiary-container': '#001a59',
              'primary-fixed': '#a3f69c',
              primary: '#000b01',
              'inverse-on-surface': '#ebf1ff',
              background: '#f8f9ff',
              'secondary-fixed': '#ebdcff',
              'surface-container-high': '#dde9ff',
              'on-secondary-fixed-variant': '#572ba0',
              'on-secondary': '#ffffff',
              'on-primary-fixed': '#002204',
              'on-tertiary': '#ffffff',
              'secondary-fixed-dim': '#d3bbff',
              'outline-variant': '#c6c6cc',
              secondary: '#6f46b9',
            },
            borderRadius: {
              DEFAULT: '0.125rem',
              lg: '0.25rem',
              xl: '0.5rem',
              full: '0.75rem',
            },
            fontFamily: {
              headline: ['Manrope'],
              body: ['Inter'],
              label: ['Inter'],
            },
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      body {
        font-family: 'Inter', sans-serif;
      }
      h1,
      h2,
      h3,
      .currency-display {
        font-family: 'Manrope', sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/api/auth.js"></script>
    <script src="/api/cashier.js"></script>
    <script src="/js/data-bind.js"></script>
    <script src="/js/page-init.js"></script>
  </head>
  <body class="bg-surface text-on-surface h-screen flex overflow-hidden">
    <!-- SideNavBar Component -->
    <div data-component="cashier-sidebar"></div>
    <div id="app">
    <!-- Main Workspace -->
    <main class="ml-64 flex flex-col flex-1 h-full">
      <!-- TopNavBar Component -->
      <header class="flex justify-between items-center w-full px-6 py-3 h-16 bg-surface-bright sticky top-0 z-30">
        <div class="flex items-center flex-1 max-w-xl">
          <div class="relative w-full">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant"
              >search</span
            >
            <input
              class="w-full bg-surface-container-low border-none rounded-xl pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-secondary/20 focus:bg-surface-container-lowest transition-all"
              placeholder="Search products or scan barcode..."
              type="text"
              data-product-search
            />
            <div data-search-results class="absolute top-full left-0 right-0 bg-surface-container-lowest rounded-xl shadow-xl mt-1 max-h-64 overflow-y-auto hidden z-50 border border-outline-variant/10"></div>
          </div>
        </div>
        <div class="flex items-center space-x-6">
          <div class="flex items-center space-x-4">
            <span class="material-symbols-outlined text-surface-tint" data-icon="cloud_done">cloud_done</span>
            <a
              class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors"
              data-icon="account_circle"
              href="/cashier/profile"
              >account_circle</a
            >
          </div>
        </div>
      </header>
      <!-- Content Area -->
      <div class="flex flex-1 overflow-hidden p-6 gap-6">
        <!-- Left: Product Grid & Filters -->
        <section class="flex-1 flex flex-col space-y-6 overflow-hidden">
          <!-- Category Tabs -->
          <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-2">
            <template data-list="categories">
              <button
                class="px-6 py-2 bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high rounded-full text-xs font-medium whitespace-nowrap transition-colors"
                data-text="name"
              ></button>
            </template>
          </div>
          <!-- Bento Grid Products -->
          <div class="flex-1 overflow-y-auto pr-2 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-8">
            <template data-list="products">
              <div
                class="bg-surface-container-lowest rounded-xl p-3 flex flex-col group cursor-pointer hover:shadow-lg transition-all border border-transparent hover:border-surface-container-high"
              >
                <div class="relative aspect-square mb-3 overflow-hidden rounded-lg">
                  <img
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                    data-attr="src:image"
                  />
                </div>
                <p class="text-xs font-label text-on-surface-variant uppercase tracking-tighter mb-1" data-text="category"></p>
                <h3 class="text-sm font-bold text-on-surface mb-2 line-clamp-1" data-text="name"></h3>
                <div class="mt-auto flex justify-between items-center">
                  <span class="text-lg font-extrabold text-primary flex items-baseline">
                    <span class="text-xs mr-0.5">₦</span>
                    <span data-text="price" data-format="currency"></span>
                  </span>
                  <span
                    class="material-symbols-outlined text-secondary"
                    data-icon="add_circle"
                    data-weight="fill"
                    style="font-variation-settings: 'FILL' 1"
                    >add_circle</span
                  >
                </div>
              </div>
            </template>
          </div>
        </section>
        <!-- Right: Cart Sidebar -->
        <aside class="w-96 flex flex-col bg-surface-container-lowest rounded-2xl shadow-sm overflow-hidden">
          <div class="p-5 border-b border-surface-container">
            <div class="flex justify-between items-center mb-1">
              <h2 class="text-lg font-bold">Current Cart</h2>
              <span
                class="bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider"
                data-text="cart.length"
                data-format="number"
              ></span>
            </div>
            <div class="flex items-center text-on-surface-variant text-xs space-x-2">
              <span class="material-symbols-outlined text-sm" data-icon="person">person</span>
              <span data-text="customer_name">Walk-in Customer</span>
              <button class="text-secondary font-bold hover:underline">Change</button>
            </div>
          </div>
          <!-- Itemized List -->
          <div class="flex-1 overflow-y-auto p-5 space-y-4">
            <template data-list="cart">
              <div class="flex items-center justify-between group">
                <div class="flex items-center space-x-3">
                  <div class="w-12 h-12 rounded-lg overflow-hidden bg-surface-container">
                    <img
                      class="w-full h-full object-cover"
                      data-attr="src:image"
                    />
                  </div>
                  <div>
                    <h4 class="text-sm font-bold" data-text="name"></h4>
                    <p class="text-[10px] text-on-surface-variant uppercase" data-text="variant"></p>
                  </div>
                </div>
                <div class="text-right">
                  <p class="text-sm font-bold" data-text="total" data-format="currency"></p>
                  <button class="text-error opacity-0 group-hover:opacity-100 transition-opacity">
                    <span class="material-symbols-outlined text-sm" data-icon="delete">delete</span>
            </button>
            <button
              class="flex flex-col items-center justify-center p-4 rounded-2xl bg-surface-container-low border-2 border-transparent hover:border-secondary transition-all group"
            >
              <span
                class="material-symbols-outlined text-2xl mb-2 text-on-surface-variant group-hover:text-secondary"
                data-icon="currency_bitcoin"
                >currency_bitcoin</span
              >
              <span
                class="text-xs font-bold uppercase tracking-wider text-on-surface-variant group-hover:text-secondary"
                >Crypto</span
              >
            </button>
          </div>
              </div>
            </template>
          </div>
          <!-- Footer Summary -->
          <div class="p-6 bg-surface-container-low border-t border-surface-container">
            <div class="space-y-2 mb-6">
              <div class="flex justify-between text-on-surface-variant text-sm">
                <span>Subtotal</span>
                <span data-text="summary.subtotal" data-format="currency"></span>
              </div>
              <div class="flex justify-between text-on-surface-variant text-sm">
                <span>Tax (7.5%)</span>
                <span data-text="summary.tax" data-format="currency"></span>
              </div>
              <div class="flex justify-between items-center pt-2 mt-2">
                <span class="font-bold text-on-surface uppercase text-xs tracking-widest">Total Amount</span>
                <span class="text-2xl font-black text-primary flex items-baseline">
                  <span class="text-sm mr-1">₦</span>
                  <span data-text="summary.total" data-format="currency"></span>
                </span>
              </div>
            </div>
            <button
              class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-xl font-bold text-sm tracking-widest uppercase shadow-md flex items-center justify-center space-x-3 hover:scale-[0.98] transition-transform"
            >
              <span>Checkout</span>
              <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
            </button>
          </div>
        </aside>
      </div>
    </main>
    <!-- Checkout Modal Overlay (Active State) -->
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-tertiary/60 backdrop-blur-sm p-4">
      <div
        class="bg-surface-bright w-full max-w-2xl rounded-[2rem] shadow-2xl overflow-hidden flex flex-col md:flex-row max-h-[921px]"
      >
        <!-- Modal Left: Summary -->
        <div class="bg-primary text-on-primary p-8 md:w-5/12 flex flex-col justify-between">
          <div>
            <h3 class="text-sm font-label uppercase tracking-widest text-primary-fixed-dim mb-10">Checkout Summary</h3>
            <div class="space-y-6">
              <div>
                <p class="text-[10px] text-on-primary-container uppercase font-bold tracking-tighter">Amount Due</p>
                <h2 class="text-4xl font-black tracking-tight mt-1">
                  <span class="text-xl font-medium opacity-70">₦</span>
                  <span data-text="summary.total" data-format="currency"></span>
                </h2>
              </div>
              <div class="space-y-3">
                <div class="flex justify-between text-xs opacity-70">
                  <span>Item Count</span>
                  <span data-text="summary.items_count"><!-- fallback -->3 Units</span>
                </div>
                <div class="flex justify-between text-xs opacity-70">
                  <span>Terminal ID</span>
                  <span data-text="terminal.id">TRM-042-LGS</span>
                </div>
              </div>
            </div>
          </div>
          <div class="pt-10">
            <p class="text-[10px] text-on-primary-container uppercase font-bold mb-4">Customer Status</p>
            <div class="flex bg-primary-container p-1 rounded-full">
              <button class="flex-1 py-2 text-[10px] font-bold uppercase rounded-full bg-surface-tint text-on-primary">
                Walk-in
              </button>
              <button
                class="flex-1 py-2 text-[10px] font-bold uppercase rounded-full text-on-primary-container hover:text-on-primary transition-colors"
              >
                Loyalty
              </button>
            </div>
          </div>
        </div>
        <!-- Modal Right: Payment Method -->
        <div class="p-8 md:w-7/12 bg-surface flex flex-col">
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-lg font-bold text-on-surface">Payment Method</h3>
            <button
              class="w-8 h-8 rounded-full hover:bg-surface-container-low flex items-center justify-center transition-colors"
            >
              <span class="material-symbols-outlined text-sm" data-icon="close">close</span>
            </button>
          </div>
          <div class="grid grid-cols-2 gap-3 mb-8">
            <button
              class="flex flex-col items-center justify-center p-4 rounded-2xl bg-surface-container-low border-2 border-transparent hover:border-secondary transition-all group"
            >
              <span
                class="material-symbols-outlined text-2xl mb-2 text-on-surface-variant group-hover:text-secondary"
                data-icon="payments"
                >payments</span
              >
              <span
                class="text-xs font-bold uppercase tracking-wider text-on-surface-variant group-hover:text-secondary"
                >Cash</span
              >
            </button>
            <button
              class="flex flex-col items-center justify-center p-4 rounded-2xl bg-secondary-container border-2 border-secondary shadow-sm group"
            >
              <span class="material-symbols-outlined text-2xl mb-2 text-on-secondary-container" data-icon="credit_card"
                >credit_card</span
              >
              <span class="text-xs font-bold uppercase tracking-wider text-on-secondary-container">POS Card</span>
            </button>
            <button
              class="flex flex-col items-center justify-center p-4 rounded-2xl bg-surface-container-low border-2 border-transparent hover:border-secondary transition-all group"
            >
              <span
                class="material-symbols-outlined text-2xl mb-2 text-on-surface-variant group-hover:text-secondary"
                data-icon="account_balance"
                >account_balance</span
              >
              <span
                class="text-xs font-bold uppercase tracking-wider text-on-surface-variant group-hover:text-secondary"
                >Transfer</span
              >
            </button>
            <button
              class="flex flex-col items-center justify-center p-4 rounded-2xl bg-surface-container-low border-2 border-transparent hover:border-secondary transition-all group"
            >
              <span
                class="material-symbols-outlined text-2xl mb-2 text-on-surface-variant group-hover:text-secondary"
                data-icon="dialpad"
                >dialpad</span
              >
              <span
                class="text-xs font-bold uppercase tracking-wider text-on-surface-variant group-hover:text-secondary"
                >USSD</span
              >
            </button>
          </div>
          <div class="mb-8">
            <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant block mb-2"
              >Reference Number (Optional)</label
            >
            <input
              class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-secondary/20"
              placeholder="Enter bank ref or auth code"
              type="text"
            />
          </div>
          <div class="mt-auto space-y-3">
            <button
              class="w-full h-14 bg-surface-tint text-on-primary rounded-2xl font-black text-sm tracking-widest uppercase shadow-lg shadow-surface-tint/20 hover:scale-[0.99] transition-transform"
            >
              Confirm Transaction
            </button>
            <button
              class="w-full h-12 bg-transparent text-on-surface-variant rounded-2xl font-bold text-xs tracking-widest uppercase hover:bg-surface-container-low transition-colors"
            >
              Cancel Sale
            </button>
          </div>
        </div>
      </div>
    </div>
    </div>
    <script src="/js/dashboard.js"></script>
    <script src="/cashier/js/cashier.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/router.js"></script>
    <script>
    window.__pageInit = {
      async fetch() {
        const [terminal, products] = await Promise.all([
          CashierAPI.getTerminalData(),
          CashierAPI.getProducts(),
        ])
        return { ...terminal, products: products || [] }
      }
    }
    </script>
  </body>
</html>
